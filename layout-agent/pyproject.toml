[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leso-agent-demo"
version = "0.1.0"
description = "DUV 7nm LESO lower-metal layout generation agent demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pillow>=10.0"]
fastjson = ["orjson>=3.10"]
gds = ["gdstk>=0.9"]
test = ["pytest>=8.0"]

[project.scripts]
leso-demo = "leso_agent_demo.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["leso_agent_demo*"]
